spring:
  application:
    name: metrotecnica-api

  datasource:
    url: jdbc:mysql://localhost:3306/metrotecnica?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
app:
  storage:
    padroes-path: D:/Metrotecnica_Java/storage/padroes

logging:
  level:
    org.springframework.security: DEBUG

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration-hours: 24